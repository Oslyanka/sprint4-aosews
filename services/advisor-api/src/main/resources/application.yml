server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:advisordb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

market:
  base-url: http://localhost:8081

# JWT: a classe JwtAuthFilter usa uma chave default em dev; substitua por um Bean de JwtUtil para ambientes reais.
